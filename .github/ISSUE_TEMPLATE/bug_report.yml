name: Bug report
description: Algo não funcionou como esperado
labels: [bug]
body:
  - type: textarea
    id: o-que-aconteceu
    attributes:
      label: O que aconteceu?
      description: Descreva o comportamento esperado vs. o que ocorreu.
    validations:
      required: true
  - type: textarea
    id: passos
    attributes:
      label: Passos para reproduzir
      placeholder: |
        1. Acessei ...
        2. Cliquei em ...
        3. Vi o erro ...
    validations:
      required: true
  - type: input
    id: ambiente
    attributes:
      label: Ambiente
      placeholder: "ex.: Windows 11, Chrome 140, OpenCode X.Y"
